{% load static %}
<header class="navbar">
  <div class="container navbar-container">
    <a href="/" class="navbar-brand" style="display: inline-flex; align-items: center; gap: 8px;">
      <img src="{% static 'images/flora-logo-emblem.png' %}" alt="Flora AI" style="width: 34px; height: 34px; object-fit: contain;">
      <span>Flora <span style="color: var(--color-primary-400);">AI</span></span>
    </a>
    
    <div class="landing-theme-toggle" role="group" aria-label="Theme Selection" style="margin-left: auto; margin-right: 1rem;">
      <button type="button" class="theme-toggle-btn active btn-theme-light" id="header-theme-light-btn" title="Light Theme">
        <span>☀️</span> <span>Light</span>
      </button>
      <button type="button" class="theme-toggle-btn btn-theme-dark" id="header-theme-dark-btn" title="Dark Theme">
        <span>🌙</span> <span>Dark</span>
      </button>
    </div>
    
    <button type="button" class="navbar-mobile-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z" fill="currentColor"/>
      </svg>
    </button>

    <nav aria-label="Main Navigation">
      <ul class="navbar-nav">
        {% if user.is_authenticated %}
          <li><a href="{% url 'dashboard' %}" class="nav-link {% if request.path == '/dashboard/' %}active{% endif %}">Dashboard</a></li>
          <li><a href="{% url 'detection' %}" class="nav-link {% if request.path == '/detection/' %}active{% endif %}">Detect Disease</a></li>
          <li><a href="{% url 'history' %}" class="nav-link {% if request.path == '/history/' %}active{% endif %}">History</a></li>
          <li><a href="{% url 'profile' %}" class="nav-link {% if request.path == '/profile/' %}active{% endif %}">Profile</a></li>
          <li><span class="nav-link" style="display: inline-flex; align-items: center; gap: 6px; color: var(--color-primary-300); font-weight: var(--weight-semibold);"><span style="width: 8px; height: 8px; border-radius: 50%; background-color: var(--color-primary-400); display: inline-block;"></span>{{ user.username }}</span></li>
          <li><a href="{% url 'logout' %}" class="btn btn-ghost btn-sm">Logout</a></li>
        {% else %}
          <li><a href="{% url 'home' %}" class="nav-link {% if request.path == '/' %}active{% endif %}">Home</a></li>
          <li><a href="{% url 'home' %}#how-it-works" class="nav-link">How It Works</a></li>
          <li><a href="{% url 'home' %}#core-value" class="nav-link">Core Value</a></li>
          <li><a href="{% url 'login' %}" class="btn btn-ghost btn-sm {% if request.path == '/login/' %}active{% endif %}">Login</a></li>
          <li><a href="{% url 'register' %}" class="btn btn-primary btn-sm {% if request.path == '/register/' %}active{% endif %}">Register</a></li>
        {% endif %}
      </ul>
    </nav>
  </div>
</header>
