{% load static %}
<!-- ==========================================================================
     Shared Left Sidebar Navigation Component — Flora AI
     Consistent across Dashboard, Detection, History, Weather, Profile, etc.
     ========================================================================== -->
<aside class="dash-sidebar" aria-label="Main Navigation">
  <div>
    <!-- Top-Left Sidebar Logo & Brand Lockup -->
    <div class="dash-sidebar-logo">
      <a href="{% url 'dashboard' %}" class="dash-sidebar-brand" title="Flora AI Dashboard">
        <img src="{% static 'images/flora-logo-emblem.png' %}?v=2.6" alt="Flora AI Logo" class="dash-sidebar-emblem">
        <div class="dash-sidebar-brand-text">
          <span class="dash-brand-title">Flora <span class="dash-brand-accent">AI</span></span>
          <span class="dash-brand-tagline">Detect. Understand. Protect.</span>
        </div>
      </a>
    </div>

    <!-- Navigation Menu Items -->
    <ul class="dash-nav-menu">
      <!-- 1. Dashboard -->
      <li class="dash-nav-item {% if active_page == 'dashboard' or request.path == '/dashboard/' and not active_page %}active{% endif %}">
        <a href="{% url 'dashboard' %}" class="dash-nav-link">
          <span class="dash-nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </span>
          <span>Dashboard</span>
        </a>
      </li>

      <!-- 2. Disease Detection -->
      <li class="dash-nav-item {% if active_page == 'detection' or request.path == '/detection/' %}active{% endif %}">
        <a href="{% url 'detection' %}" class="dash-nav-link">
          <span class="dash-nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="22" y1="12" x2="18" y2="12"></line>
              <line x1="6" y1="12" x2="2" y2="2"></line>
              <line x1="12" y1="6" x2="12" y2="2"></line>
              <line x1="12" y1="22" x2="12" y2="18"></line>
            </svg>
          </span>
          <span>Disease Detection</span>
        </a>
      </li>

      <!-- 3. Detection History -->
      <li class="dash-nav-item {% if active_page == 'history' or request.path == '/history/' %}active{% endif %}">
        <a href="{% url 'history' %}" class="dash-nav-link">
          <span class="dash-nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
          </span>
          <span>Detection History</span>
        </a>
      </li>

      <!-- 4. Weather Intelligence -->
      <li class="dash-nav-item {% if active_page == 'weather' %}active{% endif %}">
        <a href="{% url 'dashboard' %}#weather-overview" class="dash-nav-link">
          <span class="dash-nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path>
            </svg>
          </span>
          <span>Weather Intelligence</span>
        </a>
      </li>

      <!-- 5. Profile & Settings -->
      <li class="dash-nav-item {% if active_page == 'profile' or request.path == '/profile/' %}active{% endif %}">
        <a href="{% url 'profile' %}" class="dash-nav-link">
          <span class="dash-nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <span>Profile</span>
        </a>
      </li>
    </ul>
  </div>

  <!-- Bottom Sidebar Logout Trigger -->
  <div class="dash-sidebar-bottom">
    <button type="button" id="trigger-logout-modal" class="dash-logout-btn">
      <span class="dash-nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </span>
      <span>Logout</span>
    </button>
  </div>
</aside>
